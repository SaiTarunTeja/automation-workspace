<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Select Dropdown</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .dropdown-menu {
            min-width: 280px;
            max-height: 350px;
            overflow-y: auto;
        }

        .category {
            font-weight: bold;
            color: #0d6efd;
            padding: 6px 0;
        }

        .subcategory {
            padding-left: 25px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown">
            Select Skills
        </button>

        <div class="dropdown-menu p-3">

            <!-- Backend -->
            <div class="category">Backend</div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="Java" id="java">
                <label class="form-check-label" for="java">Java</label>
            </div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="Python" id="python" checked>
                <label class="form-check-label" for="python">Python</label>
            </div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="NodeJS" id="nodejs">
                <label class="form-check-label" for="nodejs">NodeJS</label>
            </div>

            <hr>

            <!-- Frontend -->
            <div class="category">Frontend</div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="HTML" id="html" checked>
                <label class="form-check-label" for="html">HTML</label>
            </div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="CSS" id="css">
                <label class="form-check-label" for="css">CSS</label>
            </div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="JavaScript" id="javascript" checked>
                <label class="form-check-label" for="javascript">JavaScript</label>
            </div>

            <hr>

            <!-- Database -->
            <div class="category">Database</div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="MySQL" id="mysql">
                <label class="form-check-label" for="mysql">MySQL</label>
            </div>

            <div class="form-check subcategory">
                <input class="form-check-input" type="checkbox" value="MongoDB" id="mongodb">
                <label class="form-check-label" for="mongodb">MongoDB</label>
            </div>
			
			

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
